<body>
<div id="sbzBackBar"><a href="javascript:void(0)" onclick="if(window.history.length>1){history.back();}else{location.href='/second-year';}" title="Go Back" aria-label="Go Back">&#8592;</a></div>

<div class="search-wrap" id="searchWrap">
  <div class="search-card">
    <div class="search-badge">SECOND YEAR • SY</div>
    <div class="search-title">🧾 Payment Receipt</div>
    <div class="search-sub">अपना 16-digit PRN डालें — आपकी Second Year Premium membership की official receipt बन जाएगी (Print / Save as PDF).</div>
    <label class="inp-label">🎓 PRN Number</label>
    <input class="inp" id="searchPRN" placeholder="0000000000000000" maxlength="16" inputmode="numeric"
      onkeydown="if(event.key==='Enter')fetchReceipt()" oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
    <div class="inp-hint">Exactly 16 digits • Numbers only</div>
    <button class="fetch-btn" id="fetchBtn" onclick="fetchReceipt()">Generate Receipt →</button>
    <div class="error-box" id="errorBox"></div>
  </div>
</div>

<div class="receipt-wrap" id="receiptWrap">
  <div class="download-bar">
    <button class="dl-btn dl-back" onclick="goBack()">← Back</button>
    <button class="dl-btn dl-print" onclick="window.print()">🖨️ Print / Save PDF</button>
  </div>
  <div id="receipt"></div>
</div>
