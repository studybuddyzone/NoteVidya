<!--
  ══════════════════════════════════════════════════════════════
  WHY THIS FILE EXISTS

  Inside the Capacitor app, the WebView has no built-in PDF renderer
  (unlike the Chrome browser app) and no way to open a new tab or run
  a native file download. So navigating straight to a PDF URL, or using
  target="_blank", or the "download" attribute — all silently do nothing
  inside the app, even though they work fine in a normal browser.

  This page renders the PDF itself, page by page, onto <canvas> using
  PDF.js — pure JS/canvas, no native PDF support needed. It works
  identically inside the app and in a regular browser.

  USAGE — link to this page instead of the raw PDF URL:
    pdf-viewer?url=<encoded PDF url>&name=<encoded display name>
  ══════════════════════════════════════════════════════════════
-->
