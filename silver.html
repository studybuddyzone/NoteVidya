<!--
  ══════════════════════════════════════════════════════════════
  THIS FILE BELONGS IN THE STUDYBUDDY PRO PROJECT — a SEPARATE
  website/codebase from the Manager-public admin dashboard.

  How the two connect:
  - The admin uploads a PDF from the dashboard's "Management" section,
    picking the subject "AIML" (or types it exactly as it appears below).
  - The PDF itself goes to Cloudinary; a small record (name + url) gets
    saved to the database at:  management/AIML/files/<id>
  - THIS page just reads that same path, live, and shows each PDF as
    its own card — named exactly after the PDF the admin uploaded.
  - Nothing is uploaded, edited, or deleted from this page. It's
    read-only for students.

  To make a page for a different subject (ML, CSE, Civil, Mechanical,
  ENTC, or any custom name the admin typed while uploading), copy this
  file and change ONLY the SUBJECT constant below to match — it must be
  spelled exactly like the subject name typed in the dashboard (this
  page takes care of turning spaces into underscores itself, same as
  the backend does).

  Data flows through THIS PROJECT'S OWN BACKEND (api/backend.js →
  the server API), never through the client-side SDK —
  so the Realtime Database rules stay fully locked down (read/write:
  false) exactly as they already are. Nothing here needs the rules
  opened up.
  ══════════════════════════════════════════════════════════════
-->
